name: Refresh MagangHub Token

on:
  schedule:
    # Berjalan setiap 4 jam sekali (UTC: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Memungkinkan trigger manual via tombol di GitHub

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Refresh Endpoint
        run: |
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" "https://${{ secrets.VERCEL_PROJECT_DOMAIN }}/api/cron-refresh")
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "✅ Refresh successful!"
          else
            echo "❌ Refresh failed with status non-200"
            exit 1
          fi
